# Cabeceras de seguridad de la SPA. Se incluyen en cada `location` que las necesita
# porque en nginx un `add_header` propio anula los heredados del nivel superior.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

# Todo se sirve desde el mismo origen. `style-src` admite estilos en línea porque
# Angular inyecta los estilos de cada componente como etiquetas <style>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
