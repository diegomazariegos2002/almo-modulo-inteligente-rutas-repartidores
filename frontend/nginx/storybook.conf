# =============================================================
# nginx de Storybook: sirve el catálogo de componentes ya compilado
# (archivos estáticos, sin backend).
# =============================================================
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No anuncia la versión de nginx en las respuestas ni en las páginas de error.
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # ── Comprobación de salud del contenedor ───────────────────
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
