<main class="flex min-h-dvh items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <div class="mb-6 flex justify-center">
      <app-logo />
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-xl font-semibold tracking-tight text-slate-900">Inicia sesión</h1>
      <p class="mt-1 mb-5 text-sm text-slate-600">
        Asignación inteligente de rutas para repartidores.
      </p>

      @if (sesion() === 'expirada') {
        <app-aviso
          class="mb-4 block"
          tipo="info"
          mensaje="Tu sesión expiró. Inicia sesión de nuevo."
        />
      }

      <app-login-form
        [enviando]="enviando()"
        [error]="error()"
        [cuentasDemo]="cuentasDemo"
        (ingresar)="ingresar($event)"
      />
    </div>
  </div>
</main>
