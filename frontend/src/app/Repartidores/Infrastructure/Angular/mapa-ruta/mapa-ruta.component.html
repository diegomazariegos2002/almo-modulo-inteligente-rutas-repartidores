<figure class="rounded-xl border border-slate-200 bg-white p-3">
  <svg
    class="h-auto w-full"
    role="img"
    [attr.viewBox]="cajaVista"
    [attr.aria-label]="descripcion()"
  >
    <rect class="fill-slate-100" x="0" y="0" width="100%" height="100%" rx="10" />

    <polyline
      class="fill-none stroke-primary"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="1 6"
      [attr.points]="trazo()"
    />

    <!-- Posición actual del repartidor: de aquí sale la ruta. -->
    <rect
      class="fill-slate-900 stroke-white"
      width="16"
      height="16"
      rx="4"
      stroke-width="2"
      [attr.x]="origen().x - 8"
      [attr.y]="origen().y - 8"
    />

    @for (parada of paradas(); track parada.secuencia) {
      <circle
        class="fill-primary stroke-white"
        r="11"
        stroke-width="2"
        [attr.cx]="parada.x"
        [attr.cy]="parada.y"
      />
      <text
        class="fill-on-primary text-[11px] font-bold"
        text-anchor="middle"
        dominant-baseline="central"
        [attr.x]="parada.x"
        [attr.y]="parada.y"
      >
        {{ parada.secuencia }}
      </text>
    }
  </svg>

  <figcaption class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-600">
    <span class="flex items-center gap-1.5">
      <span class="size-3 rounded-[3px] bg-slate-900" aria-hidden="true"></span>
      Posición del repartidor
    </span>
    <span class="flex items-center gap-1.5">
      <span class="size-3 rounded-full bg-primary" aria-hidden="true"></span>
      Paradas en orden de visita
    </span>
    <span class="basis-full">Esquema con distancias en línea recta; no muestra calles.</span>
  </figcaption>
</figure>
