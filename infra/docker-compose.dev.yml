# =============================================================
# Infraestructura para DESARROLLO LOCAL: solo PostgreSQL y Redis.
# El backend y el frontend se corren en el host (nx serve / ng serve).
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Los puertos del host (5434 y 6380) evitan chocar con un PostgreSQL
# o un Redis que ya estén instalados en la máquina.
# =============================================================
name: almo-rutas-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almo_dev_2026}
      POSTGRES_DB: almo_ruta
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d almo_ruta']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - '${REDIS_PORT:-6380}:6379'
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-almo_redis_dev_2026}', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD:-almo_redis_dev_2026}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
